/* COPA ILHA CLUB DE CARTAS 6.0 · MATCHDAY

:root{--v6-cream:#fbf4dd;--v6-olive:#dce7a4;--v6-ink:#101914;--v6-night:#121b19;--v6-line:rgba(241,246,222,.18);--v6-muted:#aebaa8}

.broadcast{max-width:1180px;padding-top:28px;color:var(--v6-cream)}

/* SUPER COPA ILHA | ARQUIBANCADA 2.0

:root{
 --bg:#061326;--surface:#0b1a34;--panel:#0d2241;--panel2:#112d50;
 --line:#365882;--ink:#f8fcff;--muted:#c1d2e9;
 --accent:#ffe254;--accent2:#19cfdf;--gold:#ffe254;--green:#7debb9;
 --display:Impact,"Arial Narrow","Arial Black",sans-serif;
}
html{scroll-behavior:smooth}
body{
 color:var(--ink);
 font-family:"Trebuchet MS",Arial,system-ui,sans-serif;
 background:
  radial-gradient(ellipse 56% 38% at 98% 12%,#17678a5e,transparent 85%),
  radial-gradient(ellipse 70% 40% at -9% 7%,#1142af6b,transparent 81%),
  linear-gradient(135deg,#061329 0%,#081d42 50%,#041021 100%);
 background-attachment:fixed;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;z-index:0;
 background:
  repeating-linear-gradient(0deg,transparent 0 47px,#ffffff08 48px 49px),
  repeating-linear-gradient(90deg,transparent 0 47px,#ffffff08 48px 49px),
  linear-gradient(115deg,transparent 22%,#5db9e808 23%,transparent 40%);
}
.noise{opacity:.07}
.topbar{
 min-height:77px;border-bottom:3px solid #e9cc44;
 background:linear-gradient(105deg,#07122b 0%,#112b5d 44%,#071427 100%);
 box-shadow:0 10px 50px #0009,inset 0 4px 0 #3c7aa644;
 padding:10px clamp(15px,3.5vw,62px);
}
.brand{gap:16px}
.brand-mark{
 width:50px;height:55px;border-radius:4px;clip-path:polygon(15% 0,85% 0,100% 25%,88% 100%,12% 100%,0 25%);
 background:linear-gradient(145deg,#ffe767 0%,#d6950f 55%,#614008 100%);
 color:#0b2546;display:flex;flex-direction:column;justify-content:center;gap:0;
 text-shadow:none;font-family:var(--display);font-size:23px;line-height:1;
 box-shadow:inset 0 0 0 3px #fff8;
}
.brand-mark small{font-size:9px;letter-spacing:.13em}
.brand-title{font-family:var(--display);font-size:22px;font-style:italic;letter-spacing:.055em;text-shadow:2px 2px 0 #0008}
.brand-title span{color:#ffe452}
.brand-sub{color:#89dcfa;letter-spacing:.15em;font-size:10px;font-weight:800}
.nav-step{font-weight:900;color:#a5bed8;border-radius:2px;transform:skew(-8deg)}
.nav-step.on{background:#ffe254;box-shadow:4px 4px 0 #042c61;color:#0a2247}
.nav-step b{border-radius:2px}
.nav-step.on b{background:#0a2b53;color:#ffe254}
.nav-step.done b{background:#08a4b7;color:white}
.icon-btn{border-radius:5px;background:#091a36;border:1px solid #6eabd37a;box-shadow:inset 0 1px 0 #fff2}
.icon-btn.active{color:#ffe55c;border-color:#ffe55c}
.main{max-width:1600px;padding-top:33px}
.eyebrow,.panel-label,.smallcaps,.smallcaps,.tag{font-weight:950;color:#ffe55e;letter-spacing:.14em}
.eyebrow:before{content:"▰ ";color:#13d0df}
.mega,.page-title,.coach-name,.end-title{
 font-family:var(--display);font-style:italic;letter-spacing:.015em;text-transform:uppercase;
 text-shadow:4px 5px 0 #0007;
}
.mega{font-size:clamp(56px,7.2vw,115px);line-height:.97;letter-spacing:.005em;margin-top:26px}
.mega em{color:#ffe45c;text-shadow:4px 5px 0 #062953,0 0 48px #ffdf345b}
.page-title{font-size:clamp(35px,3.5vw,57px);letter-spacing:.025em}
.hero-lead{color:#dceaff;font-size:16px}
.subtitle{color:#d1def1}
.micro{color:#b1c3d9}
.panel{
 border:2px solid #3682b28c;border-radius:5px;
 background:linear-gradient(160deg,#123665f2 0%,#0a1e3af7 55%,#08162cfb 100%);
 box-shadow:8px 8px 0 #020e20a9,inset 0 1px 0 #bbf3ff24;
}
.panel-inner{padding:22px}
.pill{border-radius:3px;background:#092b4f;letter-spacing:.09em;box-shadow:inset 0 1px #ffffff18}
.pill.gold{background:#6a520f4d;color:#ffed80;border-color:#fbe456a1}
.pill.green{background:#155a4866;color:#8bffb5;border-color:#2cc393}
.btn{

 border:1px solid #ffffff75;
 box-shadow:4px 5px 0 #020c20a6;

.btn.primary{

.btn.gold{background:linear-gradient(105deg,#ffeb92,#e9b83c);color:#06274a}
.btn.outline{border:1px solid #76caf3b7;background:#12345b;color:#e5f9ff}
.btn.ghost{background:#0a2946;color:#cbe6f2}
.btn:not(:disabled):hover{transform:translateY(-3px);filter:brightness(1.2)}
.home-grid{min-height:585px}
.home-grid>section{position:relative;z-index:1}
.name-box{max-width:575px;background:#042345;border:2px solid #79c7e8;border-radius:4px;box-shadow:5px 5px 0 #02091b}
.name-box input{font-family:"Trebuchet MS",Arial,sans-serif;font-weight:850}
.home-stats .pill{background:#0b3e65;border-color:#447eab}
.hero-art{height:540px;min-height:440px;overflow:visible}
.hero-art:before{
 border:3px solid #77cba344;border-radius:8px;inset:25px 0;
 background:
  linear-gradient(0deg,#030e20d5 0%,transparent 50%,#041327da 100%),
  repeating-linear-gradient(95deg,#0c7d5733 0 56px,#0d4a6a33 57px 120px),
  linear-gradient(165deg,#0a274b,#217a6499 70%,#0b3153);
 box-shadow:0 0 80px #126aa744,inset 0 0 60px #031322;
 filter:none;
}
.hero-halo{border:3px solid #ffe65a9c;box-shadow:0 0 100px #ffc9235c,inset 0 0 55px #fce33a35;border-radius:9px;transform:rotate(11deg)}
.hero-halo:after{border:2px dashed #fff6b266;border-radius:6px}
.hero-card{transform:rotate(-6deg);box-shadow:18px 22px 0 #061329d8}
.hero-sticker{border-radius:4px;border:2px solid #ffe16a;box-shadow:5px 5px #050e1c;transform:rotate(4deg)}
.hero-side{font-weight:900;color:#ffe691}
.player-card{
 border-radius:4px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
 border:2px solid color-mix(in srgb,var(--team),white 38%);
 background:linear-gradient(155deg,color-mix(in srgb,var(--team),#165f86 35%),#0d1e3b 80%);
 box-shadow:inset 0 2px #ffffff61,0 9px 17px #0007;
}
.player-card:after{background:linear-gradient(120deg,transparent 22%,#ffffff22 33%,transparent 46%),repeating-linear-gradient(105deg,transparent 0 17px,#ffffff07 18px 20px,transparent 21px 37px)}
.player-card.legend{border:2px solid #ffe785;background:linear-gradient(155deg,#958145,#5b4519 42%,#151f35 95%)}
.player-card.legend .ovr{color:#ffe186}
.player-card .ovr{font-family:var(--display);font-weight:900;letter-spacing:.03em}
.player-card .c-name{font-family:"Trebuchet MS",Arial,sans-serif;font-weight:950}
.player-card .legend-label{color:#fff296}
.hero-card .player-card{border-radius:6px}
.pitch{border:3px solid #7ccbb3;border-radius:4px;box-shadow:inset 0 0 50px #020c1377,5px 5px 0 #021d29}
.slot-hex{border-radius:3px;background:#071d2cca;border:2px dashed #ffedb5}
.slot.occupied .slot-hex{background:linear-gradient(145deg,#ffde67,#b67a20);border-color:#fff7b2;color:#07213e}
.slot.selected .slot-hex{outline-color:#58e6fa}
.slot-rating{font-family:var(--display)}
.bench-slot{background:#0b3855;border:1px solid #6cafc1;border-radius:3px}
.bench-slot.selected{background:#d8af3777;border-color:#ffe65a}
.carousel-team{border:2px solid color-mix(in srgb,var(--team),white 30%);border-radius:3px}
.carousel-team h3{font-family:var(--display);font-size:31px;letter-spacing:.02em}
.empty-state{border-radius:4px}
.coach-card{border-radius:4px}
.tournament-banner{border-radius:4px;border:2px solid #5cb6e477;background:linear-gradient(100deg,#143763,#0c1b39)}
.tournament-banner h3{font-family:var(--display);font-size:clamp(24px,2.3vw,39px);letter-spacing:.02em}
.standings{font-size:12px}
.fixture{border-radius:2px}
/* Television-like scoreline — rival hue influences the whole stadium */
.match{--rival:#ec5b63}
.match-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:18px}
.match-head .page-title{margin:3px 0 6px}
.match-head .eyebrow{font-size:10px}
.match .stadium{
 padding:12px 23px 8px;
 border:2px solid color-mix(in srgb,var(--rival),#fff 40%);
 border-bottom:4px solid var(--rival);border-radius:3px;
 background:linear-gradient(95deg,color-mix(in srgb,var(--rival),#061835 80%) 0%,#06162e 48%,color-mix(in srgb,var(--rival),#061835 75%) 100%);
 box-shadow:0 0 54px color-mix(in srgb,var(--rival),transparent 82%);
}
.match .score-row{grid-template-columns:1fr 150px 1fr;align-items:center}
.match .score-team{font-weight:950;font-size:clamp(13px,1.35vw,19px)}
.match .score-center .clock{font-family:var(--display);font-size:15px;letter-spacing:.15em}
.match .score-center strong{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:.025em;text-shadow:2px 3px #000}
.match .score-scorers{padding:6px 0;min-height:24px}
.match .stadium-status{font-size:10px;padding:5px 0 0;letter-spacing:.11em;color:#a7d8f7}
.match-showcase{display:grid;grid-template-columns:minmax(0,1fr) 357px;gap:12px;margin-top:13px;align-items:stretch;min-height:0}
.arena-panel{min-width:0;display:flex;flex-direction:column;border:2px solid #67b4d7;border-radius:4px;overflow:hidden;background:#0b1c2f;box-shadow:6px 7px 0 #0006}
.arena-top,.arena-bottom{padding:9px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,#061e35,#0e3e62,#07152d)}
.arena-title{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.07em;flex-wrap:wrap}
.arena-title strong{color:#fff9cf}
.arena-title>span:last-child{font-size:10px;color:#bed5e8}
.arena-chip{border:1px solid #41a6af;background:#0d4852;color:#b8fff0;padding:5px 9px;white-space:nowrap;font-size:9px;font-weight:950;letter-spacing:.07em}
.live-dot{width:9px;height:9px;flex:none;border-radius:50%;background:#e74242;box-shadow:0 0 0 4px #e742422a;animation:liveBlink 1.2s infinite}
@keyframes liveBlink{50%{opacity:.38;box-shadow:0 0 0 8px #e7424211}}
.arena-canvas-wrap{background:#081522;position:relative;flex:1;display:flex;align-items:center;justify-content:center}
#matchCanvas{width:100%;max-height:620px;height:auto;display:block;aspect-ratio:1024 / 572;object-fit:contain;background:#0b542b}
.arena-bottom{font-size:9px;color:#c3dcef;letter-spacing:.08em;flex-wrap:wrap}
/* always-visible substitutions sidebar */
.swap-center{border:2px solid #fadf57;box-shadow:6px 7px 0 #0008,inset 0 1px #fff3;border-radius:3px;padding:11px 12px 10px;background:linear-gradient(165deg,#173f6a,#0a2649 72%,#071c34);min-height:0}
.swap-top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #ffffff24;padding-bottom:8px}
.swap-top h3{font:italic 30px/1 var(--display);letter-spacing:.035em;margin:4px 0;color:#ffe66a}
.swap-top .panel-label{font-size:9px}
.swap-count{font:34px/1 var(--display);color:#ffe66a;min-width:56px;text-align:right}
.swap-count small{font-size:16px;color:#a9cbdc}
.swap-help{font-size:10px;line-height:1.4;color:#d7e8f6;margin:8px 0}
.swap-label{display:flex;align-items:center;gap:8px;font-weight:1000;letter-spacing:.10em;font-size:10px;color:#ffeb89;margin:8px 0 5px}
.swap-label:before{content:"■";color:#44ccf4}
.reserve-stack{display:grid;grid-template-columns:1fr;gap:4px}
.reserve-tile,.starter-tile,.swap-option{width:100%;display:flex;align-items:center;text-align:left;gap:7px;color:white;cursor:pointer;transition:background .12s,transform .12s;border:1px solid #3c779f;background:#0c3559;border-radius:2px}
.reserve-tile{padding:6px 8px;min-height:43px;border-color:#a9cc649e;background:#194a60}
.reserve-tile:not(:disabled):hover,.starter-tile:not(:disabled):hover{background:#145c83;transform:translateX(-2px);border-color:#ffe368}
.mini-ovr{background:#d2ae39;color:#0b2137;width:37px;height:30px;flex:none;display:grid;place-items:center;font:22px var(--display);border-radius:2px}
.reserve-ident{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.reserve-ident strong,.starter-name{font-weight:950;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.reserve-ident small{font-size:9px;color:#a9ddea}
.enter-mark{font-weight:1000;color:#ffe35b;font-size:20px}
.starter-scroll{display:grid;grid-template-columns:1fr;gap:3px;max-height:296px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}
.starter-scroll::-webkit-scrollbar{width:5px}.starter-scroll::-webkit-scrollbar-thumb{background:#70afbe}
.starter-tile{min-height:33px;padding:4px 6px;background:#102d4d}
.start-ovr{background:#123b59;border:1px solid #76a8c7;color:#fefb96;width:29px;height:25px;display:grid;place-items:center;font:17px var(--display);flex:none}
.starter-info{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px}
.starter-name{font-size:10px}
.energy{width:100%;height:4px;display:block;background:#06182e;border-radius:0;overflow:hidden}
.energy i{display:block;height:100%;background:linear-gradient(90deg,#25c179,#e7e95e)}
.energy-pct{font-size:9px;color:#b1e6c6;width:28px;text-align:right}
.swap-tile-btn{font-size:9px;padding:4px 6px;background:#f8d55a;color:#0a2c4e;font-weight:950;border-radius:2px}
.sub-hint{margin-top:8px;border-top:1px solid #3c86b05c;padding-top:6px;color:#bdddf0;font-size:9px;line-height:1.4}
.match-progress{margin-top:14px}
.match-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:#091c36;border:2px solid #1e6588;padding:12px 15px;margin:11px 0 15px;border-radius:2px}
.match-grid{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}
.match-grid .commentary{height:390px}
.match-grid h3{font-family:var(--display);letter-spacing:.04em;font-size:23px}
.comment{border-radius:2px}
.comment.goal{border-left:4px solid #f5d958;background:#ffdf5830}
.comment.card{border-left:4px solid #ffb348}
.comment p{font-size:13px}
.tactic-btn{border-radius:2px}
.tactic-btn.on{background:#f9db58;color:#0e2242;border-color:#f4dd6a}
.tactic-btn.on small{color:#153959}
.coach-field-guide{display:flex;gap:5px;justify-content:space-between}
.coach-field-guide span{padding:6px;background:#0e4c5e;color:#cef1e5;font-size:10px;font-weight:800}
.swap-modal{width:min(590px,92vw);max-height:min(80vh,720px);overflow:auto;border-radius:5px;border:3px solid #ffe45b;background:linear-gradient(145deg,#0d315d,#061a37);box-shadow:15px 15px 0 #000b}
.swap-modal h3{font-family:var(--display);font-size:26px;color:#ffe65b;margin:0}
.swap-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#154b68;border-left:5px solid #ffe55b;margin:16px 0;padding:12px;font-size:15px}
.swap-banner span{color:#dbf5ff;font-size:10px;white-space:nowrap}
.swap-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.swap-option{min-height:59px;padding:8px;background:#0a3c63}
.swap-option:hover{background:#226e8e;border-color:#ffe66b}
.swap-rating{display:grid;place-items:center;background:#e7c344;color:#03223b;font:26px var(--display);width:43px;height:41px;flex:none}
.swap-option strong,.swap-option small{display:block}.swap-option strong{font-size:11px}.swap-option small{margin-top:4px;font-size:9px;color:#b2d9e8}
.swap-arrow{color:#ffeb92;font-weight:950;font-size:10px;margin-left:auto}
.footer-note{border-top:1px solid #266c87;color:#97b5c9;font-size:10px}
@media(max-width:1250px){
 .match-showcase{grid-template-columns:minmax(0,1fr) 315px}
 .swap-top h3{font-size:25px}.swap-center{padding:9px}
}
@media(max-width:1000px){
 .match-showcase{grid-template-columns:1fr}
 .swap-center{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
 .swap-top,.swap-help,.sub-hint{grid-column:1/-1}
 .swap-label{align-self:end}
 .reserve-stack{grid-column:1;align-self:start}
 .starter-scroll{grid-column:2;grid-row:4;max-height:250px}
 .match-grid{grid-template-columns:1fr}
 .match .score-row{grid-template-columns:1fr 135px 1fr}
 .arena-panel{max-width:100%}
}
@media(max-width:700px){
 .topbar{min-height:65px}.brand-title{font-size:17px}.brand-mark{width:42px;height:46px;font-size:20px}.brand-sub{font-size:8px;letter-spacing:.08em}
 .main{padding:22px 12px 60px}
 .home-grid{grid-template-columns:1fr}
 .hero-art{height:340px;min-height:340px}.hero-halo{max-width:300px}.hero-card .player-card{width:180px;min-height:265px;height:265px}.hero-card .face svg{width:115px;height:115px}
 .mega{font-size:clamp(48px,11vw,75px)}
 .match-head{align-items:flex-start;flex-direction:column;gap:5px}
 .match .score-center strong{font-size:34px}
 .match .score-row{grid-template-columns:1fr 95px 1fr}
 .match .score-team{font-size:12px}
 .match .score-team .crest{width:31px!important;height:35px!important;font-size:9px}
 .match .stadium{padding:10px 9px 7px}
 .swap-center{grid-template-columns:1fr;display:block}
 .starter-scroll{display:grid;grid-template-columns:1fr 1fr;max-height:none;overflow:visible;gap:5px}
 .reserve-stack{grid-template-columns:repeat(3,minmax(0,1fr))}
 .reserve-tile{min-width:0;flex-wrap:wrap;justify-content:center;text-align:center;padding:6px 3px}
 .reserve-ident{min-width:0;flex-basis:100%}.reserve-ident strong{font-size:9px;max-width:100%}.enter-mark{display:none}
 .swap-tile-btn{display:none}.starter-tile{min-width:0}
 .arena-top{padding:7px}.arena-title{gap:6px;font-size:9px}.arena-title>span:last-child{display:none}.arena-chip{font-size:8px}
 .arena-bottom{padding:7px;font-size:8px}
 .match-footer .btn{padding:10px 12px;font-size:10px}
 .match-grid .commentary{height:330px}
 .swap-options{grid-template-columns:1fr}
}
@media(max-width:390px){
 .match .score-center strong{font-size:30px}
 .match .score-team{font-size:10px}
 .brand-title{font-size:14px}
 .arena-bottom span:last-child{display:none}
}
@media(prefers-reduced-motion:reduce){
 .live-dot{animation:none}
 .btn,.player-card,.reserve-tile,.starter-tile{transition:none!important}
}

/* Fondo de tela continua, mesmo após rolar abaixo da primeira viewport */
.shell{background:radial-gradient(ellipse at 85% 4%,#205e8050,transparent 35%),linear-gradient(135deg,#061329,#0a2350 52%,#061426);min-height:100vh}
.formation-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0 10px}
.formation-btn{font:italic 24px var(--display);letter-spacing:.04em;padding:11px;border-radius:2px;color:#e3f7ff;border:2px solid #3a7796;background:#0b2947;cursor:pointer}
.formation-btn.on{background:#ffe05c;color:#0c2b43;border-color:#fff0a1;box-shadow:3px 3px #05243a}
.formation-btn:disabled{opacity:.55;cursor:not-allowed}
.shell:has(.match) .topbar{border-bottom-color:var(--rival-color,#ffe254);background:linear-gradient(105deg,color-mix(in srgb,var(--rival-color),#071528 80%),#07152e 48%,color-mix(in srgb,var(--rival-color),#05142a 77%))}
.match:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 33% at 75% 3%,color-mix(in srgb,var(--rival),transparent 74%),transparent 80%);z-index:-1}
.match{position:relative;isolation:isolate}

/* DRAFT SUPER COPA ILHA • EDIÇÃO RAIZ 3.0
   Direção artística própria: revista de futebol brasileira 2004–2009 + placar de TV + interface PS2.
   Não reproduz logo, fontes ou trilha musical de jogo de terceiros. */
:root{
 --bg:#11100e;--surface:#1b201b;--panel:#22261d;--panel2:#303c29;--ink:#f7f0d8;
 --line:#67755b;--muted:#c3bea7;--accent:#d8ee70;--accent2:#ffd987;
 --gold:#f8d879;--green:#d3f36e;--display:Impact,'Arial Narrow','Arial Black',sans-serif;
}
body{font-family:'Arial Narrow','Trebuchet MS',Arial,sans-serif;color:var(--ink);background:
 radial-gradient(ellipse at 4% 18%,#697c422a,transparent 45%),
 radial-gradient(ellipse at 96% 70%,#7b392728,transparent 48%),
 repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 5px),
 linear-gradient(135deg,#1d241d 0%,#141916 42%,#15110f 100%);}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.09;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px);mix-blend-mode:overlay;}
.noise{opacity:.09;background-image:radial-gradient(#eee8c4 1px,transparent 1px);background-size:6px 6px;}
.topbar{background:linear-gradient(90deg,#131915,#2b3624 49%,#171a16);border-bottom:5px solid #dde877;box-shadow:0 14px 0 #080b0833;min-height:86px;}
.brand-mark{background:linear-gradient(140deg,#e3f174,#7e9c34);color:#152111;transform:rotate(-6deg);clip-path:polygon(20% 0,84% 0,100% 20%,84% 100%,14% 100%,0 79%);box-shadow:4px 4px #0009;}
.brand-title{font-size:26px;letter-spacing:.03em;font-style:normal;text-shadow:3px 3px #071009}
.brand-title span{color:#dff57d}
.brand-sub{color:#c4dca6;font-size:9px}
.nav-step{background:#252a25;border:1px solid #637454;color:#bac7ab;transform:skew(-5deg);}
.nav-step.on{background:#e2f480;color:#151e13;border-color:#f4ffce;box-shadow:5px 5px 0 #0007}
.nav-step.on b{background:#28371b;color:#edf7d0}
.nav-step.done b{background:#779448}
.icon-btn{background:#1b261b;border:1px solid #8b9f66;border-radius:0;box-shadow:3px 3px #060c05}
.icon-btn.active{border-color:#ebf481;color:#edf77a}
.main{max-width:1600px}
.eyebrow,.panel-label,.smallcaps{color:#d9ef79;letter-spacing:.16em;font-weight:1000}
.eyebrow:before{content:'◆ ';color:#f4b67c}
.mega,.page-title,.coach-name,.end-title{font-family:var(--display);font-style:normal;letter-spacing:.012em;color:#fff3d6;text-shadow:5px 5px #080c08;text-transform:uppercase}
.mega{font-size:clamp(58px,8vw,132px);line-height:.88;letter-spacing:.005em;transform:rotate(-1deg)}
.mega em{color:#e4f57a;text-shadow:5px 6px #41571b}
.page-title{font-size:clamp(36px,4vw,66px)}
.hero-lead{color:#ebe4d0;font-size:16px;line-height:1.65}
.subtitle,.micro{color:#d2d0bc}
.panel{background:linear-gradient(160deg,#283127f5,#181e1af8 73%,#171917);border:2px solid #859363;border-radius:0;box-shadow:7px 7px 0 #0008,inset 0 3px #ffffff15}
.panel-inner{padding:23px}
.pill{border-radius:0;color:#f4f4de;border:1px solid #8a9972;background:#344031;box-shadow:2px 2px #0006}
.pill.gold{background:#595032;color:#ffec92;border-color:#eed482}
.pill.green{background:#405934;color:#e7ffb7;border-color:#a0d867}
.btn{border-radius:0;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);background:#354834;border:2px solid #edf5c8;color:#fef9e0;font-family:'Arial Narrow',Arial,sans-serif;font-weight:1000;font-size:13px;box-shadow:5px 5px #050805;letter-spacing:.07em}
.btn.primary,.btn.gold{background:linear-gradient(110deg,#edfa94,#c5e46a 45%,#8fa844);color:#132214;border-color:#f6ffcd;box-shadow:5px 5px #090c09,0 0 25px #d6fa5252}
.btn.outline{background:#343f2d;color:#fbf5dc;border-color:#a5b973}
.btn.ghost{background:#242c24;color:#d8dec8}
.btn:not(:disabled):hover{transform:translateY(-3px) rotate(-.5deg);filter:brightness(1.12)}
.difficulty-picker{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:19px 0 12px}
.diff-option{padding:10px 14px;background:#253528;border:2px solid #7b886d;color:#e4e7d4;font-weight:1000;letter-spacing:.05em;cursor:pointer}
.diff-option.on{background:#e4ef89;color:#192618;border-color:#fcffe1;box-shadow:3px 3px #000b}
.name-box{border:2px solid #dfeb9b;background:#171f19;border-radius:0;box-shadow:6px 6px #0009}
.name-box input{background:#111d14;color:#fff9df;font-weight:900}
.hero-art{height:530px}
.hero-art:before{inset:20px 0;border:5px solid #99b67d;background:repeating-linear-gradient(101deg,#194632bd 0 65px,#285d3fba 66px 130px),radial-gradient(ellipse at 50% 15%,#cce8a4a1,transparent 55%);transform:rotate(3deg);box-shadow:15px 15px #08110e}
.hero-halo{border:5px dashed #eaf3a28f;border-radius:0;transform:rotate(-8deg)}
.hero-side{color:#dded92}
.hero-card{transform:rotate(4deg);box-shadow:16px 16px #040c06}
.hero-sticker{border-radius:0;background:#c7eb60;color:#1b2613;border:3px solid #f6ffdc;box-shadow:5px 5px #000a;transform:rotate(-8deg)}
.player-card{border-radius:0;clip-path:polygon(0 0,88% 0,100% 12%,100% 100%,0 100%);background:linear-gradient(145deg,color-mix(in srgb,var(--team),#57734b 42%),#181e1c 87%);border:2px solid color-mix(in srgb,var(--team),#eaf4cb 45%);box-shadow:inset 4px 4px #ffffff21,6px 6px #050a0699}
.player-card.legend{background:linear-gradient(135deg,#d5ba5f,#69562b 36%,#272b1f 90%);border:3px solid #fff1a2;box-shadow:5px 6px #100b04,0 0 24px #e5bf6354}
.player-card .ovr{font-size:42px;line-height:1;color:#ecf2ce}
.player-card.legend .ovr{color:#fff09d}
.player-card .c-name{font-size:13px;color:#fff9df;font-weight:1000}
.pitch{background:repeating-linear-gradient(90deg,#336c3d 0 55px,#275c37 56px 115px);border:4px solid #d5e7a9;box-shadow:8px 8px #09130b;border-radius:0}
.slot-hex{background:#1b281ae0;border:2px solid #e9f3bf;border-radius:0;clip-path:polygon(15% 0,85% 0,100% 16%,100% 84%,85% 100%,15% 100%,0 84%,0 16%)}
.slot.occupied .slot-hex{background:linear-gradient(150deg,#e9e99c,#779f45);color:#182319}

/* COPA ILHA CLUB DE CARTAS · design system original 2006/2026
   Papel esportivo, cards colecionáveis, tinta, gramado e painéis de arcade.
   Não utiliza fotos, fontes ou logotipos de terceiros. */
:root{--bg:#121a14;--surface:#242b21;--panel:#252d24;--panel2:#313d31;--ink:#f7f1df;--muted:#c5c9b1;--line:#849777;--accent:#d9553e;--accent2:#fbac58;--gold:#f1d38a;--green:#d7e59b;--display:Impact,'Arial Narrow','Arial Black',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{color:var(--ink);background:radial-gradient(ellipse at 4% 10%,#718f4c20 0,transparent 43%),radial-gradient(ellipse at 100% 60%,#ab512527,transparent 43%),repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 8px),#141b15;font-family:'Trebuchet MS',Tahoma,Arial,sans-serif}
body:before{opacity:.05;z-index:0;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px)}

.shell{min-height:100vh;overflow:hidden}.main{max-width:1530px;margin:auto;padding:38px clamp(18px,3.6vw,62px) 84px}.row{flex-wrap:wrap}
.topbar{background:linear-gradient(105deg,#18241b,#293324 47%,#111912);border-bottom:4px solid #dfc480;box-shadow:0 7px 0 #050a0870,0 20px 40px #0007;min-height:79px;padding:10px clamp(16px,3.6vw,62px);gap:20px}
.brand-mark{clip-path:polygon(0 0,100% 0,100% 75%,76% 100%,0 100%);background:linear-gradient(160deg,#dd6f4f,#a83529);border:2px solid #efbc82;color:#ffedcf;width:52px;height:54px;transform:rotate(-5deg);font:900 18px/1 var(--display);text-shadow:2px 2px #421811;letter-spacing:0;box-shadow:5px 5px #080b08}
.brand-mark small{font:900 11px/1 Tahoma;letter-spacing:.25em}.brand-title{font-family:var(--display);font-size:clamp(17px,1.6vw,25px);font-style:normal;letter-spacing:.045em;text-shadow:3px 3px #050907}.brand-title span{color:#eec879}.brand-sub{color:#a4ba91;letter-spacing:.15em;font-size:9px}
.stage-nav{gap:7px}.nav-step{font-size:10px;padding:8px 10px;border:1px solid #71846265;background:#1d281f;color:#bac8a5;border-radius:2px;transform:skew(-6deg)}.nav-step b{border:1px solid #819079;border-radius:0}.nav-step.on{background:#f0d38a;color:#242719;border-color:#f7e6b8;box-shadow:3px 3px #030805}.nav-step.on b,.nav-step.done b{background:#9f3c2f;color:#ffeed2;border-color:#9f3c2f}.nav-step.done{color:#fff1d1}
.icon-btn{background:#263122;color:#efe4c8;border:1px solid #9eac7f;border-radius:2px;box-shadow:3px 3px #0a0d0a}.icon-btn.active{border-color:#f1d78c;color:#f3d68a}
.eyebrow,.panel-label,.smallcaps,.tag{font-weight:1000;color:#d9dca4;letter-spacing:.18em}.eyebrow:before{content:'◆ ';color:#df7657}.mega,.page-title,.coach-name,.end-title{font-family:var(--display);color:#fff3d5;font-style:normal;letter-spacing:.008em;text-transform:uppercase;text-shadow:5px 5px #060a07}
.page-title{font-size:clamp(39px,5vw,72px);line-height:.97;margin-top:11px}.page-title span{color:#eebc76}.subtitle{color:#dadac4;line-height:1.65}.micro{color:#c2c4ae}.section-head{align-items:end;margin-bottom:27px}.section-head .subtitle{max-width:650px}
.panel{background:linear-gradient(145deg,#2e382aeF,#1f2920 75%,#1d2420);border:2px solid #738668;border-radius:4px;box-shadow:8px 9px #080b0ab8,inset 0 2px #ffffff14}.panel-inner{padding:22px}.pill{background:#283627;color:#e4e4cf;border:1px solid #738362;border-radius:2px;box-shadow:2px 2px #0b120b;padding:7px 11px;font-size:10px}.pill.gold{color:#281c12;background:#eac97e;border-color:#fff0b2}.pill.green{background:#485b2f;color:#eff7b8;border-color:#a0bc67}.btn{border-radius:2px;clip-path:none;background:#374631;border:2px solid #c9cca9;color:#f7f0da;font:900 12px/1.2 'Trebuchet MS',Arial,sans-serif;box-shadow:4px 5px #060a07;letter-spacing:.04em;min-height:46px}.btn.primary{background:linear-gradient(115deg,#e4a765,#db6d4c 75%,#bd4937);border-color:#fbd19c;color:#23170e;box-shadow:5px 6px #070906,0 0 21px #d55c4246}.btn.gold{background:linear-gradient(105deg,#fff0b2,#e2bc6d);border-color:#ffedb5;color:#241a12}.btn.outline{background:#2c392c;color:#eee2c7;border:1px solid #c0c998}.btn.ghost{background:#283127;color:#c8cfb7;border-color:#6e816b}.btn:not(:disabled):hover{transform:translate(-1px,-3px);filter:brightness(1.12)}.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f3d88e;outline-offset:3px}
/* Capa / entrada */
.home-page{padding-top:26px}.home-grid{min-height:610px;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:35px;align-items:center}.intro-copy{padding:16px 0 20px}.stamp{display:inline-flex;gap:10px;align-items:center;color:#241c14;background:#e7c583;border:1px solid #ffe8a6;padding:8px 12px;font:900 10px Tahoma;letter-spacing:.15em;transform:rotate(-1deg);box-shadow:4px 4px #07110a;margin-bottom:22px}.stamp span{color:#b64539}.mega{font-size:clamp(62px,7.25vw,119px);line-height:.91;max-width:800px;margin:19px 0;letter-spacing:.008em}.mega em{color:#efb67e;text-shadow:5px 6px #722d22;white-space:nowrap}.hero-lead{color:#dfe2c9;font-size:15px;max-width:610px;line-height:1.76}.home-console{border:1px solid #6f8163;background:linear-gradient(135deg,#202b22eE,#141e17ef);box-shadow:6px 6px #0b0f0b;padding:18px 19px 19px;max-width:620px;margin:25px 0 0;position:relative}.home-console:before{content:'◆ CLUB DE CARTAS · REGISTRO OFICIAL';position:absolute;right:8px;top:-12px;background:#9b4333;color:#f4d8a5;font-size:8px;padding:5px 9px;letter-spacing:.1em}.home-console .name-box{margin:9px 0 15px;max-width:none;border:2px solid #adbd8b;background:#101a14;box-shadow:3px 3px #0a0c09;border-radius:0}.name-box input{font-size:15px;color:#f7e9cc;font-weight:800}.home-console .mode-label{font-size:10px;color:#d3d7bd;letter-spacing:.15em;font-weight:1000;margin:14px 0 6px}.home-console .difficulty-picker{margin:4px 0 11px;gap:8px}.diff-option{font-size:10px;padding:10px 12px;border:1px solid #869878;background:#202e24;color:#e4e4cd;box-shadow:2px 2px #0c140e}.diff-option.on{background:#e8c783;color:#1c221a;border-color:#f8e4ab;box-shadow:3px 3px #10160f}.home-stats{margin-top:20px;gap:8px}.home-stats .pill{background:#2f3a30}
.hero-art{height:560px;min-height:520px;isolation:isolate;overflow:visible}.hero-art:before{inset:45px 8px;border:2px dashed #c6a66c94;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 15deg,#cfb35f0e 15deg 19deg);transform:rotate(-12deg);filter:none}.hero-halo{border:5px dotted #d3a56b58;border-radius:50%;transform:rotate(15deg);max-width:430px}.hero-burst{position:absolute;left:0;top:20%;font-family:var(--display);font-size:clamp(45px,6vw,94px);line-height:.86;color:#f7ddaa0e;transform:rotate(-12deg);letter-spacing:.02em}.hero-burst small{display:block;font:900 10px Tahoma;letter-spacing:.25em}.hero-side{top:16%;left:3%;color:#d6c28b;font-size:10px}.hero-card{transform:rotate(-7deg);box-shadow:20px 20px #070a06;z-index:3}.hero-card:before{content:'';position:absolute;inset:15px;border:2px solid #f9e6b34f;z-index:5;pointer-events:none}.hero-sticker{z-index:6;right:-4%;bottom:17%;background:#ae4e3b;padding:14px 15px;border:2px solid #efd496;border-radius:2px;transform:rotate(7deg);box-shadow:6px 6px #070a09}.hero-sticker strong{color:#ffe9b6;font-size:18px}.hero-sticker span{color:#f6e5cb}.hero-ticket{position:absolute;left:1%;bottom:13%;font:900 12px Tahoma;letter-spacing:.1em;color:#e9e1bc;transform:rotate(-8deg)}.hero-ticket b{color:#df8467;margin:0 8px}
.feature-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:28px;border-top:3px solid #d4b87b;border-bottom:1px solid #85946c;background:#253124}.feature-strip>div{padding:22px 20px;border-right:1px solid #66765c}.feature-strip>div:last-child{border-right:0}.feature-strip span{font-family:var(--display);font-size:31px;color:#d1a276;float:left;margin-right:12px}.feature-strip strong{font-family:var(--display);letter-spacing:.05em;color:#f5ebd0;font-size:20px}.feature-strip p{font-size:12px;line-height:1.55;color:#bcc5ab;margin:5px 0 0}
/* Cartas colecionáveis com uniformes vetoriais inéditos */
.player-card{--team:#ac554b;position:relative;overflow:hidden;min-height:230px;aspect-ratio:.74;display:flex;flex-direction:column;border:3px solid #cebc8b;border-radius:9px;padding:9px 10px 10px;color:#fcf2d8;background:radial-gradient(ellipse at 85% 16%,#ffffff4f,transparent 48%),linear-gradient(150deg,color-mix(in srgb,var(--team),#d1c58b 24%) 0%,color-mix(in srgb,var(--team),#171c1a 35%) 51%,#131b18 100%);box-shadow:inset 0 0 0 3px #1a221b,5px 7px #090e0b9c,0 14px 24px #0005;transform:translateZ(0);text-align:left;transition:transform .16s,border-color .16s,filter .16s}.player-card:before{content:'';position:absolute;inset:-85% -150%;transform:rotate(23deg) translateX(-75%);background:linear-gradient(90deg,transparent,#ffffff29,transparent);transition:transform .35s;pointer-events:none;z-index:4}.player-card:hover:before{transform:rotate(23deg) translateX(62%)}.player-card:hover{transform:translateY(-6px) rotate(-1deg);border-color:#fff0b3}.player-card:after{content:'';position:absolute;inset:7px;border:1px solid #fff9d97d;z-index:2;border-radius:5px;pointer-events:none;background:repeating-linear-gradient(135deg,#ffffff07 0 1px,transparent 1px 12px)}.player-card.legend{background:radial-gradient(ellipse at 60% 25%,#fff8a05a,transparent 52%),repeating-linear-gradient(115deg,#e9d18b10 0 6px,transparent 6px 14px),linear-gradient(160deg,#d9b862 0%,#8e642b 45%,#251e13 100%);border:3px solid #ffefa7;box-shadow:inset 0 0 0 3px #6b471e,0 0 18px #e5b75947,6px 8px #0d0a06}.player-card.secret-card{filter:saturate(.75)}
.card-vintage-head{display:flex;justify-content:space-between;gap:4px;position:relative;z-index:2;font:900 8px 'Trebuchet MS';letter-spacing:.12em;color:#fff6d6b5;border-bottom:1px solid #fff5d76d;padding:0 2px 5px;margin-bottom:6px;white-space:nowrap}.player-card .c-top{position:relative;z-index:2;justify-content:space-between}.player-card .ovr{font:900 35px/.85 var(--display);letter-spacing:0;color:#fff8e8;text-shadow:2px 2px #0c150d,0 1px 15px #0009}.player-card .role{font-size:9px;letter-spacing:.12em;color:#f9eac6}.player-card .c-edition{font:900 23px Georgia,serif;color:#ffe4a6;text-shadow:2px 2px #16140f}.player-card .face{z-index:1;position:relative;width:100%;margin:-14px auto -8px;min-height:80px;flex:1;display:grid;place-items:center;pointer-events:none}.player-card .face .shirt-art{display:block;width:90%;max-width:150px;height:auto;max-height:149px;filter:drop-shadow(4px 10px 4px #0a0e0a80)}.player-card .c-bottom{z-index:2;border-top:2px solid #fff1c578;position:relative;min-height:69px;padding:8px 0 0}.player-card .card-rarity{font:900 9px 'Trebuchet MS';letter-spacing:.11em;text-transform:uppercase;color:#fff0c1;margin-bottom:5px}.player-card .c-name{font:900 clamp(12px,1.1vw,15px)/1.15 var(--display);text-transform:uppercase;min-height:unset;text-align:left;display:block;letter-spacing:.02em;overflow-wrap:anywhere;color:#fff7df}.player-card .card-fullname{font-size:9px;line-height:1.2;color:#fff2cebd;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-card .c-club{display:flex;justify-content:space-between;gap:3px;color:#fcecccaf;font-weight:800;font-size:9px;margin-top:7px;line-height:1.2;border-top:1px solid #f8e4b73d;padding-top:6px}.player-card .c-club b{color:#ffe7aa}

for(const t of teams){const used=new Set(t.players.filter(p=>p.number!=null).map(p=>Number(p.number)));

   const choices=p.role==='GOL'?[1,12,22,30,99]:Array.from({length:98},(_,i)=>i+2);
   const start=stableHash(p.id)%choices.length;
   for(let k=0;k<choices.length;k++){const n=choices[(start+k)%choices.length];if(!used.has(n)){p.number=n;used.add(n);break;}}
   p.generatedNumber=true;
  }
}

function decisionSchedule(penaltyMinute){
 const slots=penaltyMinute!=null?pick([2,3]):pick([3,4]);
 const minuteRanges=slots===2?[[10,20],[32,43]]:slots===3?[[7,15],[22,30],[38,46]]:[[6,12],[17,24],[29,36],[40,46]];
 const chosen=shuffle(EVENT_BANK).slice(0,slots);
 return chosen.map((event,i)=>{let minute=rand(...minuteRanges[i]);if(penaltyMinute!=null){let trials=0;while(Math.abs(minute-penaltyMinute)<3&&trials++<25)minute=rand(...minuteRanges[i]);}return {minute,id:event.id,used:false};});
}
function decisionData(id){return EVENT_BANK.find(x=>x.id===id)||pick(EVENT_BANK);}

function teamOf(id){return id==='me'?{...custom,equipe:s.teamName,short:s.teamName}:byId[id];}
function fullPlayer(id){if(id.endsWith('_legend')){const b=byPlayer[id.slice(0,-7)];return b?makeLegend(b):null;}return byPlayer[id]||null;}
function makeLegend(p){return {...p,id:p.id+'_legend',ovr:p.legendData.overall,role:p.role,legend:true,category:'LENDÁRIO'};}
function clubColor(tid){return teamOf(tid)?.color||'#d45159';}
function crest(t,size=48){return `<span class="crest" style="--team:${esc(t.color)};width:${size}px;height:${Math.round(size*1.1)}px">${esc(t.icon||'FC')}</span>`;}
function sourceClub(p){return p?byId[p.teamId]?.equipe||'SEM CLUBE':'';}
function chemistryInfo(players=s.slots.slice(0,8).map(id=>id?fullPlayer(id):null)){
 const valid=players.filter(Boolean),groups={};for(const p of valid){const club=sourceClub(p);groups[club]=(groups[club]||0)+1;}
 const counts=Object.values(groups);const pairs=counts.reduce((n,c)=>n+c*(c-1)/2,0);
 const adjacent=[[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[4,7],[5,7],[6,7]];
 const linked=adjacent.filter(([a,b])=>players[a]&&players[b]&&sourceClub(players[a])===sourceClub(players[b])).length;
 const bonus=clamp(Math.round(pairs*1.05+linked*.85),0,12);
 const score=clamp(Math.round(24+Math.min(70,pairs*5+linked*4)+(valid.length/8)*6),0,100);
 const main=Object.entries(groups).sort((a,b)=>b[1]-a[1])[0]||['MISTO',0];
 return {score,bonus,pairs,linked,mainClub:main[0],mainCount:main[1],groups};
}
function chemistryStrip(compact=false){const c=chemistryInfo();return `<div class="chemistry-strip ${compact?'compact':''}"><div class="chem-icon">✦</div><div class="chem-info"><span class="chem-name">ENTROSAMENTO DO ELENCO</span><strong>${c.score}<small>/100</small> <span>+${c.bonus} DE FORÇA</span></strong><div class="chem-bar"><i style="width:${c.score}%"></i></div><small>${c.linked} conexões em campo · ${c.mainCount>1?esc(c.mainClub)+' ×'+c.mainCount:'Procure cartas do mesmo clube'}</small></div></div>`;}

function roundRobin(group){let list=[...group],N=list.length;if(N%2)list.push(null);const rounds=[];for(let r=0;r<list.length-1;r++){

 rounds.push(fixtures);list=[list[0],list[list.length-1],...list.slice(1,-1)];}
 return rounds;
}

   const pickOne = filt => {
     const pool = EVENT_BANK.filter(filt).filter(e=>!used.has(e.id));

     used.add(ev.id); return ev;

   const chosen = [pickOne(e=>['jogada','meio'].includes(e.genre)), pickOne(e=>['defesa','goleiro'].includes(e.genre)), pickOne(e=>!isInteractiveGenre(e.genre))];
   if(total===4) chosen.push(pickOne(e=>true));
   return chosen.map((event,i)=>{ let minute=rand(...minuteRanges[i]); if(penaltyMinute!=null){ let trials=0; while(Math.abs(minute-penaltyMinute)<3 && trials++<30) minute=rand(...minuteRanges[i]); } return {minute,id:event.id,used:false}; });

const V10_ORIGINAL_SOUND = soundFX;
soundFX=function(kind){

 if(!s.sound||!audio?.ctx||!['roll','legend','goal'].includes(kind))return;
 try{
  const ctx=audio.ctx,t=ctx.currentTime+.06;
  const pattern=kind==='goal'?[523.25,659.25,783.99,1046.5]:kind==='legend'?[440,659.25,880,1174.66]:[260,329.63,392];
  pattern.forEach((hz,i)=>{

    g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.035,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.2);
    osc.connect(g).connect(audio.gain);osc.start(t+i*.09);osc.stop(t+i*.09+.22);
  });
 }catch(e){}
};

const eventLogo = TEAM_ART.COPA.logo;
function teamArt(t){
  if(!t) return TEAM_ART.COPA;
  return TEAM_ART[(t.equipe||'')+'::'+(t.temporada||'')] || TEAM_ART[t.equipe] || {logo:null,accent:t.color||'#607887'};
}
teams.forEach(t=>{ const art=teamArt(t); t.logo=art.logo; t.accent=art.accent||t.color; if(art.crowd) t.crowd=art.crowd; });
const v21style=document.createElement('style');
v21style.id='v21-logo-style';
v21style.textContent=`
:root{--ci-gold:#d2b06a;--ci-paper:#f3ead6;--ci-ink:#112233;}
.shell::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at top center, rgba(210,176,106,.08), transparent 34%);z-index:0;}
.shell>*{position:relative;z-index:1;}
.brand-mark{overflow:hidden;display:grid;place-items:center;background:#fbf7ef!important;border-color:rgba(210,176,106,.55)!important;}
.brand-mark img{display:block;width:100%;height:100%;object-fit:contain;}
.crest.crest-logo{display:inline-flex;align-items:center;justify-content:center;border-radius:18px;background:linear-gradient(180deg,#f8f1e2,#e6dcc5);box-shadow:0 10px 18px rgba(8,16,28,.18), inset 0 0 0 1px rgba(255,255,255,.55);padding:6px;overflow:hidden;}
.crest-logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));}
.player-card.v21-logo-card{background:linear-gradient(180deg,#fffdf8,#f4ecdb 58%,#ebe1cf 100%);border:1px solid rgba(17,34,51,.08);box-shadow:0 16px 28px rgba(6,14,26,.16);color:#122235;overflow:hidden;position:relative;}
.player-card.v21-logo-card::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(180deg,var(--team,#9eb7d7),rgba(255,255,255,.25));opacity:.9;}
.player-card.v21-logo-card.legendary::after{content:"";position:absolute;inset:0;border:1px solid rgba(210,176,106,.55);box-shadow:inset 0 0 0 2px rgba(255,236,183,.38),0 0 0 1px rgba(0,0,0,.02);pointer-events:none;}
.v21-card-wrap{position:relative;display:grid;gap:10px;padding:14px 14px 12px 18px;}
.v21-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.v21-rarity{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#0d2238;color:#f7efe1;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;}
.v21-rarity.legend{background:linear-gradient(135deg,#2f2112,#7a5b21);color:#ffebad;}
.v21-rarity.super{background:linear-gradient(135deg,#23364d,#36537c);color:#d7ecff;}
.v21-rarity.rare{background:linear-gradient(135deg,#19354a,#255c76);color:#dcf5ff;}
.v21-rarity.classic{background:linear-gradient(135deg,#30424f,#556775);color:#edf3f8;}
.v21-card-meta{display:flex;align-items:center;gap:10px;}
.v21-crest-chip{width:58px;height:58px;border-radius:16px;padding:6px;background:linear-gradient(180deg,#ffffff,#f1e6d0);box-shadow:0 8px 18px rgba(7,14,22,.16);display:grid;place-items:center;flex:0 0 auto;border:1px solid rgba(16,29,43,.08);}
.v21-crest-chip img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.v21-overall{display:flex;flex-direction:column;align-items:flex-end;min-width:58px;}
.v21-overall b{font:900 34px/1 'Impact','Arial Black',sans-serif;color:#13263b;letter-spacing:.02em;}
.v21-overall small{font-size:11px;letter-spacing:.2em;color:#6c7b89;font-weight:800;}
.v21-card-name{font-size:24px;line-height:1.04;font-weight:900;color:#0e2133;}
.v21-card-sub{font-size:12px;line-height:1.25;color:#5d6b78;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.v21-roleline{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.v21-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(17,34,51,.06);font-size:11px;font-weight:900;color:#1c3043;letter-spacing:.08em;text-transform:uppercase;}
.v21-number-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;padding-top:10px;border-top:1px solid rgba(17,34,51,.08);}
.v21-number{font:900 44px/1 'Impact','Arial Black',sans-serif;color:var(--team,#274e7d);text-shadow:0 1px 0 rgba(255,255,255,.75);}
.v21-button-hint{font-size:11px;font-weight:900;letter-spacing:.14em;color:#6f5a33;text-transform:uppercase;}
.v21-team-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.18));border-radius:14px;padding:9px 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.v21-team-strip strong{color:#102133;font-size:13px;}
.v21-team-strip span{font-size:11px;color:#65727d;font-weight:800;text-transform:uppercase;letter-spacing:.09em;}
.v20-pack-badge.is-logo{padding:4px;background:linear-gradient(180deg,#faf4e8,#e7dcc4);display:grid;place-items:center;overflow:hidden;}
.v20-pack-badge.is-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.preview-logo-title,.op-logo-row{display:flex;align-items:center;gap:10px;}
.preview-logo-title .mini-crest,.op-logo-row .mini-crest{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,#fffdf8,#efe5d0);padding:6px;box-shadow:0 8px 16px rgba(8,16,28,.14);display:grid;place-items:center;flex:0 0 auto;}
.preview-logo-title .mini-crest img,.op-logo-row .mini-crest img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.match.broadcast.v21-dfc-crowd{position:relative;overflow:hidden;}
.match.broadcast.v21-dfc-crowd::before{content:"";position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(5,12,18,.88),rgba(5,12,18,.65) 30%,rgba(7,16,22,.92)), var(--dfc-crowd);background-size:cover;background-position:center;opacity:.45;pointer-events:none;z-index:0;}
.match.broadcast.v21-dfc-crowd > *{position:relative;z-index:1;}
.broadcast-score .score-decor .event-logo-inline{display:inline-flex;vertical-align:middle;width:18px;height:18px;margin-right:7px;margin-top:-2px;}
.broadcast-score .score-decor .event-logo-inline img{width:100%;height:100%;object-fit:contain;display:block;}
.hero-burst .hero-copa-mark{display:block;width:46px;height:46px;margin:0 auto 10px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18));}
.hero-burst .hero-copa-mark img{width:100%;height:100%;object-fit:contain;display:block;}
@media (max-width:760px){.v21-card-name{font-size:22px;}.v21-overall b{font-size:31px;}.v21-crest-chip{width:54px;height:54px;}}
`;
document.head.appendChild(v21style);
crest = function(t,size=48){
  const art=teamArt(t), logo=art&&art.logo;
